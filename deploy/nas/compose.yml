name: sellio-nas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellio
      POSTGRES_USER: sellio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sellio -d sellio']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${SELLIO_IMAGE:?Set SELLIO_IMAGE in .env}
    environment:
      DATABASE_URL: postgres://sellio:${POSTGRES_PASSWORD}@db:5432/sellio
    depends_on:
      db:
        condition: service_healthy
    command: npm run db:setup
    restart: 'no'

  app:
    image: ${SELLIO_IMAGE:?Set SELLIO_IMAGE in .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sellio:${POSTGRES_PASSWORD}@db:5432/sellio
      PORT: 2509
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN:?Set the public application URL in .env}
      UPLOADS_DIR: /app/uploads
      BODY_SIZE_LIMIT: 32M
    volumes:
      - images_data:/app/uploads
    ports:
      - '${SELLIO_PORT:-2509}:2509'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:2509/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
    external: true
    name: sellio_nas_postgres_data
  images_data:
    external: true
    name: sellio_nas_images_data

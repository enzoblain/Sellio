name: Open the dev to master PR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the PR
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/${GH_REPO}/compare/master...dev" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "dev has nothing that master does not have: no PR to open."
            exit 0
          fi

          {
            echo "Au merge de cette PR, le NAS sauvegarde, migre et déploie seul (voir docs/deploy.md)."
            echo
            echo "## Changements depuis master (${ahead})"
            echo
            gh api --paginate "repos/${GH_REPO}/compare/master...dev" \
              --jq '.commits[] | "- \(.sha[0:7]) \(.commit.message | split("\n")[0])"' \
              | head -n 200
          } > body.md

          title="Release : dev → master"
          number=$(gh pr list --base master --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file body.md
            echo "PR #${number} updated."
          else
            gh pr create --base master --head dev --title "$title" --body-file body.md
          fi

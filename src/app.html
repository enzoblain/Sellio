<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applique le thème avant le premier rendu (pas de flash). Logique miroir de src/lib/theme.ts.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		<script>
			// Idem pour la barre latérale repliée : évite le saut de mise en page au chargement.
			(function () {
				try {
					if (localStorage.getItem('sidebar-collapsed') === '1')
						document.documentElement.dataset.sidebar = 'collapsed';
				} catch (e) {}
			})();
		</script>
		<script>
			// Idem pour la vue liste/grille des articles : le premier rendu utilise déjà la vue mémorisée.
			(function () {
				try {
					var view = localStorage.getItem('articles-view');
					if (view === 'list' || view === 'grid')
						document.documentElement.dataset.articlesView = view;
				} catch (e) {}
			})();
		</script>
		<link
			rel="preload"
			href="/fonts/inter-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

services:
  db:
    image: postgres:17-alpine
    container_name: sellio-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sellio
      POSTGRES_USER: sellio
      POSTGRES_PASSWORD: sellio

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellio -d sellio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sellio-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://sellio:sellio@db:5432/sellio
      PORT: 2509

    expose:
      - "2509"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

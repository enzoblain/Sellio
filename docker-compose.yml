services:
  db:
    image: postgres:17-alpine
    container_name: sellio-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sellio
      POSTGRES_USER: sellio
      POSTGRES_PASSWORD: sellio

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sellio -d sellio']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sellio-migrate

    environment:
      DATABASE_URL: postgres://sellio:sellio@db:5432/sellio

    depends_on:
      db:
        condition: service_healthy

    command: npm run db:setup

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sellio-app
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://sellio:sellio@db:5432/sellio
      PORT: 2509
      HOST: 0.0.0.0
      ORIGIN: http://localhost:2509

    ports:
      - '2509:2509'

    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
